  <!-- Bootstrap 5.3.3 CSS -->

  <!-- Google Fonts: Inter & Outfit -->

</head>
<body class="bg-light">

  <!-- Global Header Navigation -->
  <div id="global-navbar"></div>

  <!-- Page Header -->
  <header class="page-header text-center">
    <div class="container">
      <span class="badge-tag mb-3 d-inline-block">Portofolio Project Investasi Riil</span>
      <h1 class="fw-bold mb-3">
        Peluang Project Investasi <span class="text-gold">Per Project Sektor Riil</span>
      </h1>
      <p class="text-muted lead mx-auto mb-4" style="max-width: 720px;">
        Pilih project investasi dengan alokasi modal per project transparan, jaminan aset fisik terproteksi, dan skema bagi hasil proporsional yang amanah.
      </p>

      <!-- Bootstrap Filter Buttons -->
      <div class="d-inline-flex flex-wrap justify-content-center gap-2 bg-white p-2 rounded-pill shadow-sm border border-subtle">
        <button class="btn btn-sm btn-gold rounded-pill px-4 filter-btn active" data-filter="all">Semua Status</button>
        <button class="btn btn-sm btn-outline-gold rounded-pill px-3 filter-btn" data-filter="open">Open (Terbuka)</button>
        <button class="btn btn-sm btn-outline-gold rounded-pill px-3 filter-btn" data-filter="funded">Fully Funded</button>
        <button class="btn btn-sm btn-outline-gold rounded-pill px-3 filter-btn" data-filter="coming">Coming Soon</button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container py-5">

    <!-- Disclaimer Banner Top -->
    <div id="topDisclaimerContainer" class="mb-4"></div>

    <!-- Project Cards Grid (Rendered dynamically from data/projects.json) -->
    <div class="row g-4" id="investProjectsGrid">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-gold me-2" role="status"></div>
        <span>Memuat portofolio proyek investasi...</span>
      </div>
    </div>

  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Core JS -->
  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      MGIComponents.renderNavbar('invest');
      MGIComponents.renderFooter();

      // Fetch projects data
      const data = await MGI.fetchData('data/projects.json');
      if (!data || !data.projects) return;

      // Render top compliance banner
      const topDisclaimer = document.getElementById('topDisclaimerContainer');
      if (topDisclaimer) {
        topDisclaimer.innerHTML = MGIComponents.renderComplianceNotice(data.disclaimer_text);
      }

      const grid = document.getElementById('investProjectsGrid');
      let allProjects = data.projects;

      function renderProjects(filtered) {
        if (!filtered || filtered.length === 0) {
          if (!allProjects || allProjects.length === 0) {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-4 border border-subtle shadow-sm my-3 px-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-mgi-gold-subtle text-gold mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                  <i class="bi bi-clock-history"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Belum Ada Proyek Terbuka Saat Ini</h4>
                <p class="text-secondary small mx-auto mb-4" style="max-width: 560px;">
                  Seluruh alokasi pendanaan proyek sebelumnya telah terpenuhi (didanai penuh). Tim manajer investasi kami sedang mempersiapkan penawaran proyek investasi alat berat dan logistik berikutnya.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                  <a href="contact.html" class="btn btn-gold btn-sm rounded-pill px-4 py-2 fw-bold text-white shadow-sm">
                    <i class="bi bi-headset me-1"></i> Hubungi Layanan Kemitraan Pemodal
                  </a>
                  <a href="about.html" class="btn btn-outline-secondary btn-sm rounded-pill px-4 py-2">
                    Profil Perusahaan
                  </a>
                </div>
              </div>
            `;
          } else {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-3 border border-subtle shadow-sm my-3">
                <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                <p class="fs-5 text-muted mb-3">Tidak ada proyek yang sesuai dengan filter yang dipilih.</p>
                <button class="btn btn-outline-gold btn-sm rounded-pill px-4" onclick="document.querySelector('[data-filter=\\'all\\']').click()">Reset Filter</button>
              </div>
            `;
          }
          return;
        }
        grid.innerHTML = filtered.map(p => `
          <div class="col-12 col-md-6 col-lg-6 col-xl-4 mb-2">
            ${MGIComponents.renderProjectCard(p)}
          </div>
        `).join('');
      }

      // Initial render
      renderProjects(allProjects);

      // Filter Tabs Handling
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('btn-gold', 'active');
            b.classList.add('btn-outline-gold');
          });
          btn.classList.remove('btn-outline-gold');
          btn.classList.add('btn-gold', 'active');

          const filterVal = btn.getAttribute('data-filter');
          if (filterVal === 'all') {
            renderProjects(allProjects);
          } else if (filterVal === 'open') {
            renderProjects(allProjects.filter(p => p.status.toLowerCase().includes('open')));
          } else if (filterVal === 'funded') {
            renderProjects(allProjects.filter(p => p.status.toLowerCase().includes('funded')));
          } else if (filterVal === 'coming') {
            renderProjects(allProjects.filter(p => p.status.toLowerCase().includes('soon') || p.status.toLowerCase().includes('coming')));
          }
        });
      });
    });
  </script>
</body>
</html>
