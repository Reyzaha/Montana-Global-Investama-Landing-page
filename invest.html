</head>
<body class="bg-light">

  <!-- Global Header Navigation -->
  <div id="global-navbar"></div>

  <!-- Page Header -->
  <header class="page-header text-center">
    <div class="container">
      <span class="badge-tag mb-3 d-inline-block">Portofolio Project Investasi Riil</span>
      <h1 class="fw-bold mb-3">
        Peluang Project Investasi <span class="text-gold">Per Project Sektor Riil</span>
      </h1>
      <p class="text-muted lead mx-auto mb-4" style="max-width: 720px;">
        Pilih project investasi dengan alokasi modal per project transparan, jaminan aset fisik terproteksi, dan skema bagi hasil proporsional yang amanah.
      </p>

      <!-- Status & City Segment Filter Buttons -->
      <div class="d-inline-flex flex-wrap justify-content-center gap-2 bg-white p-2 rounded-2 shadow-sm border border-subtle" id="mainFilterContainer">
        <button class="btn btn-sm btn-gold rounded-1 px-3 py-1.5 filter-btn active" data-filter="all">Semua Status</button>
        <button class="btn btn-sm btn-outline-gold rounded-1 px-3 py-1.5 filter-btn" data-filter="open">Open (Terbuka)</button>
        <button class="btn btn-sm btn-outline-gold rounded-1 px-3 py-1.5 filter-btn" data-filter="funded">Fully Funded</button>
        <button class="btn btn-sm btn-outline-gold rounded-1 px-3 py-1.5 filter-btn" data-filter="coming">Coming Soon</button>
        <button class="btn btn-sm btn-outline-gold rounded-1 px-3 py-1.5 filter-btn d-inline-flex align-items-center gap-1.5" data-filter="city-segment" id="btnPerKota">
          <i class="bi bi-geo-alt-fill text-gold"></i>
          <span>Per Kota</span>
        </button>
      </div>

      <!-- City Sub-segment Selector (Appears when 'Per Kota' is active) -->
      <div id="citySubFilterContainer" class="d-none mt-3">
        <div class="d-inline-flex flex-wrap align-items-center justify-content-center gap-2 p-2 bg-white rounded-2 border shadow-sm" style="border-color: rgba(197, 160, 89, 0.4) !important;">
          <span class="text-uppercase small fw-bold px-2 text-muted" style="font-size: 0.72rem; letter-spacing: 0.5px;">
            <i class="bi bi-pin-map-fill text-gold me-1"></i>Pilih Kota:
          </span>
          <div id="cityButtonsList" class="d-inline-flex flex-wrap gap-1">
            <!-- Dynamic active cities injected here -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container py-5">

    <!-- Disclaimer Banner Top -->
    <div id="topDisclaimerContainer" class="mb-4"></div>

    <!-- City Segment Header (Summary when a specific city is selected) -->
    <div id="citySegmentHeader" class="d-none mb-4"></div>

    <!-- Project Cards Grid (Rendered dynamically from data/projects.json or api/projects.php) -->
    <div class="row g-4" id="investProjectsGrid">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-gold me-2" role="status"></div>
        <span>Memuat portofolio proyek investasi...</span>
      </div>
    </div>

  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Core JS -->
  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      MGIComponents.renderNavbar('invest');
      MGIComponents.renderFooter();

      // Fetch projects data
      const data = await MGI.fetchData('data/projects.json');
      if (!data || !data.projects) return;

      // Render top compliance banner
      const topDisclaimer = document.getElementById('topDisclaimerContainer');
      if (topDisclaimer) {
        topDisclaimer.innerHTML = MGIComponents.renderComplianceNotice(data.disclaimer_text);
      }

      const grid = document.getElementById('investProjectsGrid');
      const citySubContainer = document.getElementById('citySubFilterContainer');
      const cityHeader = document.getElementById('citySegmentHeader');
      let allProjects = data.projects;
      let activeCities = [];
      let selectedCitySlug = 'all';

      // Load active cities for segmentation
      try {
        const citiesRes = await MGI.fetchData('data/cities.json');
        const rawCities = (citiesRes && citiesRes.cities) ? citiesRes.cities : (Array.isArray(citiesRes) ? citiesRes : []);
        activeCities = rawCities.filter(c => !('is_active_segment' in c) || Number(c.is_active_segment) === 1);
      } catch (err) {
        console.warn('Could not load cities from API/file, auto-discovering from projects:', err);
      }

      // If active cities still empty, auto-extract from projects
      if (!activeCities || activeCities.length === 0) {
        const seen = new Set();
        allProjects.forEach(p => {
          const cName = p.city || (p.info && p.info.lokasi ? p.info.lokasi.split(',')[0].trim() : null);
          if (cName && !seen.has(cName.toLowerCase())) {
            seen.add(cName.toLowerCase());
            activeCities.push({
              name: cName,
              slug: cName.toLowerCase(),
              icon: p.city_icon || 'bi-geo-alt-fill',
              description: `Portofolio proyek investasi aktif di wilayah ${cName}`
            });
          }
        });
      }

      function renderStandardProjects(filtered) {
        cityHeader.classList.add('d-none');
        cityHeader.innerHTML = '';

        if (!filtered || filtered.length === 0) {
          if (!allProjects || allProjects.length === 0) {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-2 border border-subtle shadow-sm my-3 px-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-2 bg-mgi-gold-subtle text-gold mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                  <i class="bi bi-clock-history"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Belum Ada Proyek Terbuka Saat Ini</h4>
                <p class="text-secondary small mx-auto mb-4" style="max-width: 560px;">
                  Seluruh alokasi batch pendanaan sebelumnya telah terpenuhi (*fully funded*). Tim manajemen investasi kami sedang mempersiapkan penawaran proyek sindikasi alat berat dan logistik batch berikutnya.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                  <a href="contact.html" class="btn btn-gold btn-sm rounded-1 px-4 py-2 fw-bold text-white shadow-sm">
                    <i class="bi bi-headset me-1"></i> Hubungi Tim Investor Relations
                  </a>
                  <a href="about.html" class="btn btn-outline-secondary btn-sm rounded-1 px-4 py-2">
                    Profil Perusahaan
                  </a>
                </div>
              </div>
            `;
          } else {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-2 border border-subtle shadow-sm my-3">
                <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                <p class="fs-5 text-muted mb-3">Tidak ada proyek yang sesuai dengan filter yang dipilih.</p>
                <button class="btn btn-outline-gold btn-sm rounded-1 px-4" onclick="document.querySelector('[data-filter=\\'all\\']').click()">Reset Filter</button>
              </div>
            `;
          }
          return;
        }

        grid.innerHTML = filtered.map(p => `
          <div class="col-12 col-md-6 col-lg-4">
            ${MGIComponents.renderProjectCard(p)}
          </div>
        `).join('');
      }

      function buildCitySubButtons() {
        const listEl = document.getElementById('cityButtonsList');
        if (!listEl) return;

        let html = `
          <button type="button" class="btn btn-sm ${selectedCitySlug === 'all' ? 'btn-gold active' : 'btn-outline-secondary'} rounded-1 px-3 py-1 city-btn" data-city-slug="all">
            <i class="bi bi-grid-fill me-1"></i> Semua Kota (${allProjects.length})
          </button>
        `;

        activeCities.forEach(c => {
          const cSlug = (c.slug || c.name.toLowerCase()).trim();
          const count = allProjects.filter(p => {
            const pCity = (p.city || '').toLowerCase();
            const pSlug = (p.city_slug || '').toLowerCase();
            return pSlug === cSlug || pCity === c.name.toLowerCase();
          }).length;

          const isActive = selectedCitySlug.toLowerCase() === cSlug;

          html += `
            <button type="button" class="btn btn-sm ${isActive ? 'btn-gold active' : 'btn-outline-secondary'} rounded-1 px-2.5 py-1 city-btn" data-city-slug="${cSlug}">
              <i class="bi ${c.icon || 'bi-geo-alt-fill'} ${isActive ? 'text-white' : 'text-gold'} me-1"></i> ${c.name}
              <span class="badge ${isActive ? 'bg-white text-dark' : 'bg-light text-dark border'} ms-1" style="font-size: 0.68rem;">${count}</span>
            </button>
          `;
        });

        listEl.innerHTML = html;

        listEl.querySelectorAll('.city-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            listEl.querySelectorAll('.city-btn').forEach(b => {
              b.classList.remove('btn-gold', 'active');
              b.classList.add('btn-outline-secondary');
              const icon = b.querySelector('i');
              if (icon && !icon.classList.contains('bi-grid-fill')) {
                icon.classList.remove('text-white');
                icon.classList.add('text-gold');
              }
              const badge = b.querySelector('.badge');
              if (badge) {
                badge.className = 'badge bg-light text-dark border ms-1';
              }
            });

            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-gold', 'active');
            const icon = btn.querySelector('i');
            if (icon && !icon.classList.contains('bi-grid-fill')) {
              icon.classList.remove('text-gold');
              icon.classList.add('text-white');
            }
            const badge = btn.querySelector('.badge');
            if (badge) {
              badge.className = 'badge bg-white text-dark ms-1';
            }

            selectedCitySlug = btn.getAttribute('data-city-slug');
            renderCitySegmentView();
          });
        });
      }

      function renderCitySegmentView() {
        if (selectedCitySlug === 'all') {
          // Grouped by active city
          cityHeader.classList.add('d-none');
          cityHeader.innerHTML = '';

          let groupedHtml = '';
          let matchedCount = 0;

          activeCities.forEach(city => {
            const cSlug = (city.slug || city.name.toLowerCase()).trim();
            const cityProjects = allProjects.filter(p => {
              const pCity = (p.city || '').toLowerCase();
              const pSlug = (p.city_slug || '').toLowerCase();
              return pSlug === cSlug || pCity === city.name.toLowerCase();
            });

            if (cityProjects.length > 0) {
              matchedCount += cityProjects.length;
              groupedHtml += `
                <div class="col-12 mt-3 mb-2">
                  <div class="d-flex flex-wrap align-items-center justify-content-between pb-2 mb-3 border-bottom border-2 border-subtle">
                    <div class="d-flex align-items-center gap-2">
                      <span class="d-inline-flex align-items-center justify-content-center bg-mgi-gold-subtle text-gold rounded-1 p-1" style="width: 34px; height: 34px;">
                        <i class="bi ${city.icon || 'bi-geo-alt-fill'} fs-6"></i>
                      </span>
                      <div>
                        <h5 class="fw-bold text-dark mb-0">${city.name}</h5>
                        <small class="text-muted" style="font-size: 0.78rem;">${city.description || 'Ekosistem Investasi Wilayah ' + city.name}</small>
                      </div>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
                      <span class="badge bg-secondary-subtle text-dark border rounded-1">${cityProjects.length} Proyek Aktif</span>
                      <button type="button" class="btn btn-sm btn-outline-gold rounded-1 py-1 px-2.5" style="font-size: 0.75rem;" onclick="filterToCity('${cSlug}')">
                        Fokus Kota Ini <i class="bi bi-chevron-right ms-1"></i>
                      </button>
                    </div>
                  </div>
                </div>
                ${cityProjects.map(p => `
                  <div class="col-12 col-md-6 col-lg-4 mb-3">
                    ${MGIComponents.renderProjectCard(p)}
                  </div>
                `).join('')}
              `;
            }
          });

          if (matchedCount === 0) {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-2 border border-subtle shadow-sm my-3">
                <i class="bi bi-geo-alt fs-1 text-muted d-block mb-3"></i>
                <p class="fs-5 text-muted mb-3">Belum ada proyek yang terhubung dengan segmen kota yang aktif.</p>
              </div>
            `;
          } else {
            grid.innerHTML = groupedHtml;
          }

        } else {
          // Specific city selected
          const city = activeCities.find(c => 
            (c.slug || '').toLowerCase() === selectedCitySlug.toLowerCase() || 
            (c.name || '').toLowerCase() === selectedCitySlug.toLowerCase()
          );

          const cityName = city ? city.name : selectedCitySlug;
          const cityIcon = city ? (city.icon || 'bi-geo-alt-fill') : 'bi-geo-alt-fill';
          const cityDesc = city ? (city.description || '') : '';

          const filtered = allProjects.filter(p => {
            const pCity = (p.city || '').toLowerCase();
            const pSlug = (p.city_slug || '').toLowerCase();
            return pSlug === selectedCitySlug.toLowerCase() || pCity === cityName.toLowerCase();
          });

          cityHeader.classList.remove('d-none');
          cityHeader.innerHTML = `
            <div class="p-3 rounded-2 bg-white border border-subtle d-flex flex-wrap align-items-center justify-content-between gap-3 shadow-sm">
              <div class="d-flex align-items-center gap-3">
                <div class="d-inline-flex align-items-center justify-content-center rounded-2 bg-mgi-gold-subtle text-gold p-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
                  <i class="bi ${cityIcon}"></i>
                </div>
                <div>
                  <div class="d-flex align-items-center gap-2">
                    <h5 class="fw-bold text-dark mb-0">Segmen Kota: ${cityName}</h5>
                    <span class="badge bg-gold text-white rounded-1">${filtered.length} Proyek Terdaftar</span>
                  </div>
                  <p class="text-muted small mb-0">${cityDesc || 'Daftar proyek sindikasi dan permodalan riil di area ' + cityName}</p>
                </div>
              </div>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-1" onclick="filterToCity('all')">
                <i class="bi bi-grid-fill me-1"></i> Tampilkan Semua Kota
              </button>
            </div>
          `;

          if (filtered.length === 0) {
            grid.innerHTML = `
              <div class="col-12 text-center py-5 bg-white rounded-2 border border-subtle shadow-sm my-3">
                <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                <p class="fs-5 text-muted mb-3">Tidak ada proyek aktif di kota <strong>${cityName}</strong> saat ini.</p>
                <button type="button" class="btn btn-outline-gold btn-sm rounded-1 px-3" onclick="filterToCity('all')">Lihat Semua Kota</button>
              </div>
            `;
          } else {
            grid.innerHTML = filtered.map(p => `
              <div class="col-12 col-md-6 col-lg-4">
                ${MGIComponents.renderProjectCard(p)}
              </div>
            `).join('');
          }
        }
      }

      // Global helper for city sub-button switching
      window.filterToCity = function(slug) {
        selectedCitySlug = slug;
        buildCitySubButtons();
        renderCitySegmentView();
      };

      // Initial render: Standard View (All Projects)
      renderStandardProjects(allProjects);

      // Primary Filter Tabs Handling
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('btn-gold', 'active');
            b.classList.add('btn-outline-gold');
          });
          btn.classList.remove('btn-outline-gold');
          btn.classList.add('btn-gold', 'active');

          const filterVal = btn.getAttribute('data-filter');

          if (filterVal === 'city-segment') {
            citySubContainer.classList.remove('d-none');
            buildCitySubButtons();
            renderCitySegmentView();
          } else {
            citySubContainer.classList.add('d-none');
            cityHeader.classList.add('d-none');
            cityHeader.innerHTML = '';

            if (filterVal === 'all') {
              renderStandardProjects(allProjects);
            } else if (filterVal === 'open') {
              renderStandardProjects(allProjects.filter(p => p.status.toLowerCase().includes('open')));
            } else if (filterVal === 'funded') {
              renderStandardProjects(allProjects.filter(p => p.status.toLowerCase().includes('funded')));
            } else if (filterVal === 'coming') {
              renderStandardProjects(allProjects.filter(p => p.status.toLowerCase().includes('soon') || p.status.toLowerCase().includes('coming')));
            }
          }
        });
      });
    });
  </script>
</body>
</html>
