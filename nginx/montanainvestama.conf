# ==============================================================================
# PT MONTANA GLOBAL INVESTAMA — NGINX COMPLETE PRODUCTION CONFIGURATION
# Domains: montanainvestama.com & www.montanainvestama.com
# Architecture: Edge Reverse Proxy (SSL 443 + HTTP 80) -> Docker Apache (127.0.0.1:8085)
# ==============================================================================

# ------------------------------------------------------------------------------
# RATE LIMITING ZONES (Didefinisikan di level http)
# Membatasi endpoint sensitif login admin dan login/registrasi investor.
# Kunci: $binary_remote_addr (4 bytes untuk IPv4, 16 bytes untuk IPv128).
# Normalisasi /64 subnet IPv6 ditangani secara matematis di lapisan PHP via inet_pton.
# ------------------------------------------------------------------------------
# 1. Zone untuk Login Administrator & Verifikasi MFA
limit_req_zone $binary_remote_addr zone=mgi_admin_auth_limit:10m rate=10r/m;

# 2. Zone selektif untuk Login & Registrasi Investor (Aksi selain login/register tidak terkena limit)
map $arg_action $auth_rate_limit_key {
    login       $binary_remote_addr;
    register    $binary_remote_addr;
    default     ""; # String kosong: Nginx otomatis TIDAK menerapkan limit_req
}
limit_req_zone $auth_rate_limit_key zone=mgi_investor_auth_limit:10m rate=10r/m;

limit_req_status 429;

# ------------------------------------------------------------------------------
# 1. HTTP SERVER BLOCK (Port 80)
# Mengalihkan seluruh traffic HTTP ke HTTPS secara otomatis (301 Permanent Redirect)
# Membuka /.well-known/acme-challenge/ agar renewal SSL Let's Encrypt tetap lancar
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name montanainvestama.com www.montanainvestama.com;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/montana-global-investama;
    }

    # Redirect seluruh HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS SERVER BLOCK (Port 443 - SSL)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name montanainvestama.com www.montanainvestama.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/montanainvestama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montanainvestama.com/privkey.pem;

    # SSL Protocols & Ciphers (Modern High Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32M;

    # --------------------------------------------------------------------------
    # MODULAR SECURITY RULES (Global)
    # Memblokir direktori sensitif, file backup, repo git, ekstensi berbahaya,
    # dan eksekusi file PHP di direktori uploads/ & assets/.
    # --------------------------------------------------------------------------
    include /etc/nginx/snippets/security_rules.conf;

    # --------------------------------------------------------------------------
    # MAINTENANCE MODE HANDLING (HTTP 503)
    # Diaktifkan saat rotasi database/deploy dengan flag maintenance.flag
    # --------------------------------------------------------------------------
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/montana-global-investama;
        rewrite ^(.*)$ /maintenance.html break;
    }

    if (-f /var/www/montana-global-investama/maintenance.flag) {
        return 503;
    }

    # --------------------------------------------------------------------------
    # PERLINDUNGAN ADMIN: HTTP BASIC AUTH PADA UI PORTAL
    # Melindungi antarmuka web login admin. 
    # --------------------------------------------------------------------------
    location ^~ /portal-admin-mgi-gateway/ {
        auth_basic "PT Montana Global Investama — Restricted Management Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        include /etc/nginx/snippets/proxy_backend.conf;
    }

    # --------------------------------------------------------------------------
    # RATE LIMITING KHUSUS LOGIN & MFA ADMINISTRATOR (EXACT LOCATION)
    # limit_req membatasi brute-force, sementara proteksi database rate-limit 
    # dan validasi sesi server-side mengamankan endpoint dari akses ilegal.
    # --------------------------------------------------------------------------
    location = /api/admin/login.php {
        limit_req zone=mgi_admin_auth_limit burst=15 nodelay;

        include /etc/nginx/snippets/proxy_backend.conf;
    }

    # --------------------------------------------------------------------------
    # RATE LIMITING SELEKTIF AUTENTIKASI INVESTOR (LOGIN / REGISTRASI)
    # Aksi check_session dan logout TIDAK dikenai rate limit
    # --------------------------------------------------------------------------
    location = /api/auth.php {
        limit_req zone=mgi_investor_auth_limit burst=20 nodelay;

        include /etc/nginx/snippets/proxy_backend.conf;
    }

    # --------------------------------------------------------------------------
    # PROXY PASS UTAMA KE CONTAINER DOCKER APACHE (PORT 8085)
    # --------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/proxy_backend.conf;
    }
}
