# Nginx Configuration untuk montanainvestama.com
# PT Montana Global Investama (MGI)
# Reverse Proxy ke Docker container Apache/PHP di port 8085

upstream mgi_landingpage {
    server 127.0.0.1:8085;
}

server {
    listen 80;
    listen [::]:80;

    # Mendukung domain baru montanainvestama.com dan domain cadangan
    server_name montanainvestama.com www.montanainvestama.com montanaglobalinvestama.com www.montanaglobalinvestama.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://mgi_landingpage;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
