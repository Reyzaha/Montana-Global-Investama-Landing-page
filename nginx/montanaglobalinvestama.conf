# Nginx Configuration untuk montanaglobalinvestama.com
# Sesuai arahan Team IT Montana (Tahap 1: Sebelum SSL Certbot)

upstream mgi_landingpage {
    server 172.18.0.1:8085;
}

server {
    listen 80;
    listen [::]:80;

    server_name montanaglobalinvestama.com www.montanaglobalinvestama.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://mgi_landingpage;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
