# ==============================================================================
# PT MONTANA GLOBAL INVESTAMA — MODULAR NGINX SECURITY RULES
# Dapat di-include di server block HTTP (80) maupun HTTPS (443)
# ==============================================================================

# 1. SSL ACME CHALLENGE EXEMPTION (LET'S ENCRYPT / CERTBOT)
# Harus paling atas dengan modifier '^~' agar regex di bawah tidak mencegat challenge Let's Encrypt
location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
    root /var/www/montana-global-investama;
}

# 2. BLOKIR DIREKTORI SENSITIF, DATABASE, BACKUP, SCRIPTS & REPOSITORY
location ~ ^/(database|backups|deploy|nginx|scratch|scripts|\.git|\.agents|\.idea)/ {
    deny all;
    return 403;
}

# 3. BLOKIR EKSTENSI FILE RAWAN BOCOR
location ~* \.(sql|env|ini|log|bak|backup|sh|md|yml|yaml|dockerignore)$ {
    deny all;
    return 403;
}

# 4. BLOKIR SKRIP UTILITAS & MAINTENANCE
location ~* ^/(sync_db\.php|seed\.php|clean_dummy\.php|reset_admin\.php|export_full_database\.php|test_.*\.php|inspect_.*\.php)$ {
    deny all;
    return 403;
}

# 5. BLOKIR SELURUH HIDDEN FILES (Kecuali /.well-known/ yang sudah diizinkan di atas)
location ~ /\. {
    deny all;
    return 403;
}

# 6. BLOKIR EKSEKUSI FILE PHP DI FOLDER UPLOADS & ASSETS
location ~* ^/(uploads|assets)/.*\.php$ {
    deny all;
    return 403;
}

