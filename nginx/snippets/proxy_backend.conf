# ==============================================================================
# PT MONTANA GLOBAL INVESTAMA — REUSABLE PROXY BACKEND SNIPPET
# Parameter proxy seragam ke Docker Apache (127.0.0.1:8085)
# File ini TIDAK mengandung direktif 'location' sehingga aman di-include di dalam location mana pun.
# ==============================================================================

proxy_pass http://127.0.0.1:8085;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Authorization $http_authorization;
proxy_pass_header Authorization;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Buffer & Timeout
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
