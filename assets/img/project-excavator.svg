<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B48" />
      <stop offset="100%" stop-color="#070D24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#E5C378" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Ground Line -->
  <line x1="80" y1="380" x2="720" y2="380" stroke="#C5A059" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Excavator Graphic Silhouette -->
  <g transform="translate(180, 110)">
    <!-- Tracks / Undercarriage -->
    <rect x="70" y="210" width="220" height="50" rx="25" fill="#1A2859" stroke="#C5A059" stroke-width="3" />
    <!-- Track wheels -->
    <circle cx="95" cy="235" r="16" fill="#0E1B48" stroke="#C5A059" stroke-width="2" />
    <circle cx="140" cy="235" r="14" fill="#0E1B48" stroke="#8E9AA8" stroke-width="2" />
    <circle cx="180" cy="235" r="14" fill="#0E1B48" stroke="#8E9AA8" stroke-width="2" />
    <circle cx="220" cy="235" r="14" fill="#0E1B48" stroke="#8E9AA8" stroke-width="2" />
    <circle cx="265" cy="235" r="16" fill="#0E1B48" stroke="#C5A059" stroke-width="2" />

    <!-- Body / Cabin -->
    <path d="M 90 210 L 90 140 L 170 140 L 220 180 L 250 180 L 250 210 Z" fill="#24356E" stroke="#C5A059" stroke-width="2" />
    <!-- Cabin Window -->
    <polygon points="175,148 215,182 175,182" fill="#E5C378" opacity="0.35" stroke="#C5A059" stroke-width="1.5" />

    <!-- Counterweight -->
    <rect x="80" y="160" width="35" height="45" rx="4" fill="#C5A059" />

    <!-- Boom Arm (Main) -->
    <path d="M 210 185 L 290 80 L 315 95 L 225 200 Z" fill="#C5A059" />
    <!-- Arm (Stick) -->
    <path d="M 290 80 L 390 150 L 380 170 L 285 95 Z" fill="#E5C378" />

    <!-- Bucket -->
    <path d="M 390 150 Q 430 170 410 210 Q 380 200 375 165 Z" fill="#C5A059" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Bucket Teeth -->
    <polygon points="410,210 416,218 406,215" fill="#FFFFFF" />
    <polygon points="400,208 404,216 396,213" fill="#FFFFFF" />
    <polygon points="390,205 393,212 386,210" fill="#FFFFFF" />

    <!-- Hydraulic Cylinders -->
    <line x1="200" y1="165" x2="270" y2="105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="280" y1="100" x2="350" y2="140" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Pivot Points -->
    <circle cx="215" cy="190" r="5" fill="#0E1B48" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="295" cy="85" r="5" fill="#0E1B48" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="385" cy="155" r="4" fill="#0E1B48" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Branding Badge / Text -->
  <rect x="250" y="415" width="300" height="38" rx="19" fill="#132357" stroke="#C5A059" stroke-width="1.5" />
  <text x="400" y="440" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    PT MONTANA GLOBAL INVESTAMA
  </text>
</svg>
