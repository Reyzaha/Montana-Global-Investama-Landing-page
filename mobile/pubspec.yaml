name: mgi_investor
description: "Aplikasi Mobile Investor PT Montana Global Investama"
version: 2.1.0+1
publish_to: none

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  base:
    git:
      url: https://github.com/sisappmobile/base.git
      ref: 2.0.6

  # Inherited from base & standard stack
  get: 4.7.2
  dio: 5.8.0+1
  basic_utils: 5.8.2
  jiffy: 6.4.3
  shared_preferences: 2.5.3
  syncfusion_flutter_datepicker: 29.2.11
  lottie: 3.3.1
  easy_localization: 3.0.7+1
  smooth_corner: 1.1.1
  go_router: 15.1.2
  loader_overlay: 5.0.0
  flutter_bloc: 9.1.1
  shimmer: 3.0.0
  provider: 6.1.5
  url_launcher: 6.3.1
  package_info_plus: 8.3.0
  intl: 0.20.2
  image_watermark: 0.1.0
  geolocator: 14.0.1
  geocoding: 3.0.0
  crypto: 3.0.6
  android_id: 0.4.0
  image_picker: 1.1.2

  # Approved additions
  google_sign_in: 6.2.2
  firebase_core: 2.32.0
  firebase_messaging: 14.7.10
  flutter_local_notifications: 19.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  icons_launcher: 2.1.7

dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/font/
    - assets/image/
    - assets/lottie/
    - assets/i18n/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-Bold.ttf
        - asset: assets/font/Manrope-ExtraBold.ttf
        - asset: assets/font/Manrope-ExtraLight.ttf
        - asset: assets/font/Manrope-Light.ttf
        - asset: assets/font/Manrope-Medium.ttf
        - asset: assets/font/Manrope-Regular.ttf
        - asset: assets/font/Manrope-SemiBold.ttf
