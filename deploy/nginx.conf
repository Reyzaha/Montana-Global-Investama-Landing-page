# ==============================================================================
# PT MONTANA GLOBAL INVESTAMA — ENTERPRISE NGINX PRODUCTION CONFIGURATION
# File: /etc/nginx/sites-available/montanainvestama.com
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name montanainvestama.com www.montanainvestama.com;

    location /.well-known/acme-challenge/ {
        root /var/www/montana-global-investama;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name montanainvestama.com www.montanainvestama.com;

    root /var/www/montana-global-investama;
    index index.html index.php;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/montanainvestama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montanainvestama.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Protect secret files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Hide direct /admin path (Obscurity protection)
    location ^~ /admin {
        return 301 /index.html;
    }

    # --------------------------------------------------------------------------
    # REALTIME SERVER-SENT EVENTS (SSE) STREAMING CONFIGURATION
    # Critical: Disable all buffering & timeouts for persistent push stream
    # --------------------------------------------------------------------------
    location = /api/realtime/stream.php {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Disable FastCGI buffering to allow immediate real-time pushes
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 300s;
        proxy_buffering off;
        gzip off;

        # Keep-Alive
        keepalive_timeout 300s;
    }

    # API Endpoints
    location /api/ {
        try_files $uri $uri/ /api/router.php?$query_string;
    }

    # Clean HTML URLs (invest -> invest.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    # Logging
    access_log /var/log/nginx/montana_access.log;
    error_log /var/log/nginx/montana_error.log warn;
}
