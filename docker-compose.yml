version: '3.8'

services:
  # Web Application (PHP 8.2 + Apache)
  mgi-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgi_web_app
    restart: always
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mgi-db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-mgi_landing}
      - DB_USER=${DB_USER:-mgi_user}
      - DB_PASS=${DB_PASS}
    depends_on:
      mgi-db:
        condition: service_healthy
    networks:
      - mgi_network

  # Database Service (MySQL 8.0)
  mgi-db:
    image: mysql:8.0
    container_name: mgi_database
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${DB_NAME:-mgi_landing}
      - MYSQL_USER=${DB_USER:-mgi_user}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mgi_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - mgi_network

volumes:
  mgi_db_data:
    name: mgi_db_volume

networks:
  mgi_network:
    name: mgi_app_network
    driver: bridge
